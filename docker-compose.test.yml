version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: delbicos-postgres-test
    environment:
      POSTGRES_DB: pr2_test
      POSTGRES_USER: delbicos_test
      POSTGRES_PASSWORD: test123
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delbicos_test -d pr2_test']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

networks:
  test-network:
    driver: bridge