name: 04 - Deploy do backend no Azure App Service

# Gatilho: dispara quando um PR é mergeado na branch stag ou manualmente
on:
  pull_request:
    types: [closed]
    branches:
      - stag
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

jobs:
  deploy:
    name: Build e deploy no Azure App Service (delbicos-backend-dg)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Instalar dependências
        run: npm install

      - name: Buildar TypeScript
        run: npm run build

      - name: Remover devDependencies
        run: npm prune --omit=dev

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: delbicos-backend-dg
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: .
