name: 04 - Deploy do backend no Azure App Service

# Gatilho: dispara direto quando um PR e fechado/mergeado contra a stag-facul
# (branch de integracao do projeto academico), independente do pipeline do
# time principal (workflows 01/02/03, que so reagem a branch "stag").
# O Azure App Service (Free F1) usa deploy nativo (Oryx), sem Docker.
on:
  pull_request:
    types: [closed]
    branches:
      - stag-facul

jobs:
  deploy:
    name: Build e deploy no Azure App Service (delbicos-backend-edu)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Instalar dependências (com devDependencies, necessárias para o build)
        run: npm ci

      - name: Buildar TypeScript
        run: npm run build

      - name: Remover devDependencies antes do deploy (reduz o pacote e a superfície de ataque)
        run: npm prune --omit=dev

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: delbicos-backend-edu
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: .
