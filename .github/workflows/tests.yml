name: Testes

# Executa typecheck e testes automatizados a cada push e pull request
# (requisito da disciplina de Qualidade e Testes de Software).
on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Node (typecheck + Jest)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-with-more-than-32-chars
      STRIPE_SECRET_KEY: sk_test_ci_dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage/

  nlp-service:
    name: nlp-service Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nlp-service/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q
