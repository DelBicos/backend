name: backend-delbicos

services:
  postgres:
    image: postgres
    container_name: postgres-delbicos
    environment:
      POSTGRES_DB: delbicos
      POSTGRES_USER: delbicos
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    restart: unless-stopped
  mongo:
    image: mongo:7
    container_name: mongo-delbicos
    ports:
      - "27017:27017"
    restart: unless-stopped
  nlu-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: nlu-delbicos
    environment:
      - NLU_CONFIDENCE_THRESHOLD=${NLU_CONFIDENCE_THRESHOLD:-0.65}
      - SEMANTIC_MODEL_NAME=${SEMANTIC_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - SEMANTIC_MIN_SCORE=${SEMANTIC_MIN_SCORE:-0.35}
      - SEMANTIC_EMBEDDING_CACHE_SIZE=${SEMANTIC_EMBEDDING_CACHE_SIZE:-5000}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  delbicos-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    container_name: server-delbicos
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - IS_SERVERLESS=${IS_SERVERLESS:-false}
      - MONGODB_URI=${MONGODB_URI:-suaStringConexao}
      - SEQUELIZE_DB_NAME=${SEQUELIZE_DB_NAME:-delbicos}
      - SEQUELIZE_DB_USER=${SEQUELIZE_DB_USER:-delbicos}
      - SEQUELIZE_DB_PASS=${SEQUELIZE_DB_PASS:-postgres123}
      # Using the Docker Compose service name directly to avoid host .env interpolation issues
      - SEQUELIZE_HOST=postgres
      - SEQUELIZE_PORT=5432
      - SEQUELIZE_DIALECT=postgres
      - SECRET_KEY=${SECRET_KEY:-suaChaveSegura}
      - EXPIRES_IN=${EXPIRES_IN:-24h}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-sk_API_KEY}
      - SENDER_EMAIL_VERIFICADO=${SENDER_EMAIL_VERIFICADO:-deliverydebicos@gmail.com}
      - LAMBDA_FUNCTION_URL=${LAMBDA_FUNCTION_URL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_API_KEY}
      - MONGODB_URI=mongodb://mongo:27017/logs_db
      - MONGODB_CHAT_URI=mongodb://mongo:27017/delbicos_chat
      - NLU_SERVICE_URL=http://nlu-service:8000
      - NLU_CLASSIFIER_TIMEOUT_MS=${NLU_CLASSIFIER_TIMEOUT_MS:-1000}
      - SEMANTIC_SEARCH_TIMEOUT_MS=${SEMANTIC_SEARCH_TIMEOUT_MS:-5000}
      - SEMANTIC_MIN_SCORE=${SEMANTIC_MIN_SCORE:-0.35}
      - SEMANTIC_SEARCH_RESULT_LIMIT=${SEMANTIC_SEARCH_RESULT_LIMIT:-200}
      - VOICE_TRANSCRIPTION_PROVIDER=${VOICE_TRANSCRIPTION_PROVIDER:-}
      - VOICE_TRANSCRIPTION_URL=${VOICE_TRANSCRIPTION_URL:-}
      - VOICE_TRANSCRIPTION_API_KEY=${VOICE_TRANSCRIPTION_API_KEY:-}
      - VOICE_TRANSCRIPTION_MODEL=${VOICE_TRANSCRIPTION_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - VOICE_TRANSCRIPTION_TIMEOUT_MS=${VOICE_TRANSCRIPTION_TIMEOUT_MS:-45000}
      - VOICE_TRANSCRIPTION_ATTEMPT_TIMEOUT_MS=${VOICE_TRANSCRIPTION_ATTEMPT_TIMEOUT_MS:-20000}
      - VOICE_COMMAND_IDEMPOTENCY_TTL_MS=${VOICE_COMMAND_IDEMPOTENCY_TTL_MS:-600000}
      - VOICE_COMMAND_IDEMPOTENCY_MAX_ENTRIES=${VOICE_COMMAND_IDEMPOTENCY_MAX_ENTRIES:-10000}
    volumes:
      - ./src:/app/src
      - ./server.ts:/app/server.ts
      - ./.env:/app/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      nlu-service:
        condition: service_healthy
    restart: unless-stopped
networks:
  default:
    external: true
    name: delbicos-shared-network
